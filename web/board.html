<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harbor Board</title>
<link rel="icon" id="fav" href="/assets/branding/crimson-ledger-icon-v01.png">
<link rel="apple-touch-icon" id="touch-icon" href="/assets/branding/crimson-ledger-icon-v01.png">
<link rel="stylesheet" href="/style.css?v=20261117cr">
<link rel="stylesheet" href="/board.css?v=20261117cr">
<link rel="stylesheet" href="/ceremony.css?v=20261118brand1">
<link rel="preload" as="image" href="/assets/ceremony-harbor.png">
<link rel="preload" as="image" href="/assets/ceremony-clipper.png">
<link rel="stylesheet" id="fonts" href="/fonts.css">
<link rel="stylesheet" id="theme" href="/theme.css">
<link rel="stylesheet" href="/wordmark.css?v=20261118text1">
</head>
<body class="board">
<p id="board-loading" class="loading">…</p>
<main id="app" class="board-room" hidden>
  <header id="board-head" class="masthead br-head"></header>
  <p id="board-connection" class="br-connection" role="status"></p>
  <section id="board-turn" class="br-panel br-turn"></section>
  <div class="br-grid">
    <div class="br-chart-column">
      <section class="br-panel br-map">
        <header id="board-chart-head" class="br-section-head"></header>
        <div id="board-chart" class="br-chart-frame"></div>
      </section>
      <div id="board-advisories" class="br-advisories"></div>
    </div>
    <div class="br-ledger-column">
      <section class="br-panel br-standings">
        <header id="board-ledger-head" class="br-section-head"></header>
        <div id="board-houses" class="br-scroll"></div>
      </section>
      <section class="br-panel br-news">
        <header id="board-news-head" class="br-section-head"></header>
        <div class="br-scroll" id="board-bulletins">
          <div id="board-news"></div>
          <div id="board-gallery"></div>
        </div>
      </section>
    </div>
  </div>
  <footer id="board-controls" class="br-controls">
    <button id="bquit" type="button">Quit</button>
  </footer>
</main>
<script src="/wordmark.js?v=20261118text1"></script>
<script src="/common.js?v=20261118text1"></script>
<script src="/media.js"></script>
<script src="/voice.js"></script>
<script src="/chart.js"></script>
<script src="/ceremony.js?v=20261118brand1"></script>
<script src="/board.js?v=20261118ceremony"></script>
</body>
</html>
