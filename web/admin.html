<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center</title>
<link rel="icon" id="favicon" href="/assets/branding/crimson-ledger-icon-v01.png">
<link rel="stylesheet" href="/admin.css?v=20261118chartroom1">
<link rel="stylesheet" href="/media-admin.css?v=20261118brand1">
<link rel="stylesheet" href="/captains.css?v=cp2">
<link rel="stylesheet" id="fonts" href="/fonts.css">
<link rel="stylesheet" href="/wordmark.css?v=20261118text1">
</head>
<body>
<header id="top">
  <div class="masthead">
    <a class="brand" href="#live" data-nav="live" title="Go to Live Game">
      <img class="brand-emblem" id="gmark" src="/assets/branding/crimson-ledger-icon-v01.png" alt="" width="64" height="64">
      <span class="brand-copy">
        <span class="brand-kicker">Maritime operations · 1860</span>
        <img class="brand-logo" id="glogo" alt="Crimson Ledger" hidden>
        <b id="gname"></b>
        <span class="brand-subtitle">Command Center</span>
      </span>
    </a>
  </div>
  <div class="rail">
    <button type="button" id="status" data-nav="live" aria-label="Live game status, open Live Game"><span class="st-phase">Connecting…</span></button>
    <div class="actions" id="savebar">
      <span id="saved" class="muted">All changes saved</span>
      <span id="dirty" hidden></span>
      <button type="button" id="discard" hidden>Discard</button>
      <button type="button" id="save" class="primary" hidden title="Save &amp; apply (Ctrl+S)">Save &amp; apply</button>
    </div>
  </div>
</header>
<div id="shell">
  <nav id="nav" aria-label="Command center sections"></nav>
  <main id="main"><p class="muted">Loading…</p></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="login" hidden>
  <form class="card" id="loginform">
    <h2>Admin sign-in</h2>
    <p class="muted" id="loginmsg">Enter the admin password.</p>
    <input type="password" id="loginpw" autocomplete="current-password" placeholder="Password">
    <button type="submit" class="primary">Sign in</button>
  </form>
</div>
<script src="/wordmark.js?v=20261118text1"></script>
<script src="/art-bible.js?v=20261118brand1"></script>
<script src="/cast.js"></script>
<script src="/captains.js?v=cp2"></script>
<script src="/report.js"></script>
<script src="/media-admin.js?v=20261119mc"></script>
<script src="/graphics-admin.js?v=20261118chartroom1"></script>
<script src="/admin.js?v=20261118chartroom1"></script>
</body>
</html>
