<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<link rel="icon" id="fav" href="/assets/branding/crimson-ledger-icon-v01.png">
<link rel="apple-touch-icon" id="touch-icon" href="/assets/branding/crimson-ledger-icon-v01.png">
<link rel="stylesheet" href="/style.css?v=20261117cr">
<link rel="stylesheet" id="fonts" href="/fonts.css">
<link rel="stylesheet" id="theme" href="/theme.css">
<link rel="stylesheet" href="/wordmark.css?v=20261118text1">
<link rel="stylesheet" href="/ranks.css?v=20261119ranks">
<link rel="stylesheet" href="/sail-intel.css?v=20261123map3">
<link rel="stylesheet" href="/dashboard.css?v=20261123atlas1">
</head>

<body class="board dashboard">
<p id="db-loading" class="loading" role="status">Opening the chart room...</p>
<div id="db-fit"><main id="app" class="pw" hidden>
  <header class="pw-head">
    <div class="pw-lounge" id="pw-lounge" aria-hidden="true"></div>
    <div class="pw-brand" id="pw-brand"></div>
    <div class="pw-clock"><b id="pw-date"></b><span id="pw-sub"></span></div>
    <div class="pw-context" id="pw-context" role="group" aria-label="The voyage at a glance"></div>
  </header>
  <div class="pw-tabrow">
    <nav class="pw-tabs" id="pw-tabs" role="tablist" aria-label="Command Center tabs"></nav>
    <div class="pw-watch">
      <span id="pw-connection" role="status"></span>
      <button id="pw-watch" type="button" aria-pressed="true"><span id="pw-watch-label">Watch Mode</span><small id="pw-watch-note" role="status"></small></button>
      <button id="pw-pause" type="button" aria-pressed="false">Pin tab</button>
      <button id="pw-all" type="button" aria-haspopup="dialog">All tabs</button>
    </div>
  </div>
  <div class="pw-side"><aside class="pw-tower" id="pw-tower" aria-label="Timing tower"></aside>
  <aside class="pw-host" id="pw-host" aria-label="On the line"></aside><div id="pw-whisper" class="pw-whisper" hidden></div></div>
  <section class="pw-book" id="pw-book" aria-live="off">
    <div class="pw-leaf pw-left" id="pw-left"></div>
    <div class="pw-leaf pw-right" id="pw-right"></div>
    <div class="pw-spot" id="pw-spot" hidden aria-live="polite"></div>
  </section>
  <dialog id="pw-detail" aria-labelledby="detail-title"><button type="button" id="detail-close" autofocus>Close</button><div id="detail-body"></div></dialog>
  <dialog id="pw-whisper-detail" aria-labelledby="whisper-title">
    <button type="button" id="whisper-close" autofocus>Close</button>
    <p id="whisper-eyebrow"></p><h2 id="whisper-title"></h2><p id="whisper-text"></p>
    <div class="whisper-dialog-actions"><button type="button" id="whisper-listen">Listen</button><button type="button" id="whisper-show">Show me</button></div>
    <p id="whisper-status" role="status"></p>
  </dialog>
  <aside class="pw-instr" aria-label="Instruments">
    <div class="pw-dials" id="pw-dials"></div>
    <div class="pw-chalk" id="pw-chalk"></div>
  </aside>
  <footer class="pw-tape" id="pw-tape" aria-label="Telegraph tape"><div class="pw-tape-track" id="pw-tape-track"></div></footer>
  <dialog id="pw-drawer" aria-labelledby="drawer-title">
    <button type="button" id="drawer-close" autofocus>Close</button>
    <div id="drawer-body"></div>
    <nav class="pw-controls" aria-label="Dashboard controls">
      <button id="pw-next" type="button">Next tab</button>
      <button id="pw-spots" type="button" aria-pressed="true">Spotlights</button>
      <button id="pw-sound" type="button" aria-pressed="false">Clicks</button>
      <button id="pw-voices" type="button" aria-pressed="false">Voices</button>
      <button id="pw-quit" type="button">Quit</button>
    </nav>
  </dialog>
</main></div>
<script src="/ranks.js?v=20261119ranks"></script>
<script src="/wordmark.js?v=20261118text1"></script>
<script src="/common.js?v=20261119ranks"></script>
<script src="/media.js"></script>
<script src="/chart.js?v=20261123map"></script>
<script src="/audio.js?v=20261120snd"></script>
<script src="/voice.js?v=20261120brief"></script>
<script src="/dashboard-whisper.js?v=20261122whisper2"></script>
<script src="/dashboard-tabs.js?v=20261123atlas1"></script>
<script src="/dashboard.js?v=taipan1"></script>
</body>
</html>
